<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gry Mieszka</title>
  <meta name="description" content="Gry i projekty tworzone przez Mieszka i jego tatę.">
  <style>
    :root {
      --bg: #fff8ec;
      --card: #ffffff;
      --text: #2b2340;
      --muted: #6b6280;
      --accent: #ff6b35;
      --accent-2: #3a86ff;
      --border: #f0e2c8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17142a;
        --card: #221d3b;
        --text: #f3eefc;
        --muted: #a9a0c2;
        --accent: #ff8c5a;
        --accent-2: #6aa6ff;
        --border: #352d57;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main { max-width: 860px; margin: 0 auto; padding: 48px 16px 64px; }
    h1 { font-size: clamp(2.2rem, 7vw, 3.6rem); margin: 0 0 8px; letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    .lead { color: var(--muted); font-size: 1.15rem; margin: 0 0 40px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    .card {
      display: block;
      padding: 20px;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      color: inherit;
      text-decoration: none;
      transition: transform .15s, border-color .15s;
    }
    a.card:hover { transform: translateY(-3px); border-color: var(--accent-2); }
    .card .emoji { font-size: 2.2rem; }
    .card h2 { margin: 8px 0 4px; font-size: 1.25rem; }
    .card p { margin: 0; color: var(--muted); }
    .empty { border-style: dashed; text-align: center; color: var(--muted); }
    footer { margin-top: 56px; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Gry <span>Mieszka</span></h1>
    <p class="lead">Gry i projekty, które robimy razem: Mieszko i tata.</p>

    <!-- Każdy projekt to osobny folder w repozytorium z własnym index.html.
         Nowy projekt = nowa karta poniżej, np.:
         <a class="card" href="nazwa-gry/">
           <div class="emoji">🚀</div>
           <h2>Nazwa gry</h2>
           <p>Krótki opis.</p>
         </a>
    -->
    <section class="grid">
      <div class="card empty">
        <div class="emoji">🛠️</div>
        <h2>Wkrótce</h2>
        <p>Tu pojawią się nasze pierwsze gry.</p>
      </div>
    </section>

    <footer>Zrobione przez Mieszka i tatę.</footer>
  </main>
</body>
</html>
